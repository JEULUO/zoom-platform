spring:
  flyway:
    locations: classpath:db/migration,classpath:db/local

app:
  security:
    jwt-secret: ${JWT_SECRET:zoom-platform-local-jwt-secret-change-before-production}
    secure-cookies: false
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:ZoomDev@2026!}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}
