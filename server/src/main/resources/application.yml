spring:
  application:
    name: zoom-platform-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:zoom_platform}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:${MYSQL_USER:zoom}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:zoom_dev_password}}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  security:
    issuer: zoom-platform
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:15m}
    secure-cookies: ${SECURE_AUTH_COOKIES:true}
  bootstrap-admin:
    enabled: false
    username: admin
    password: ''
    display-name: System Administrator

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'

logging:
  pattern:
    correlation: '[%X{traceId:-}] '
