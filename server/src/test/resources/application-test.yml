spring:
  datasource:
    url: jdbc:h2:mem:zoom_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration,classpath:db/local
  data:
    redis:
      repositories:
        enabled: false
management:
  health:
    redis:
      enabled: false
app:
  security:
    jwt-secret: zoom-platform-test-jwt-secret-with-at-least-32-characters
    secure-cookies: false
